<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elemental Guardians Arena</title>
    <style>
      :root {
        --bg1: #070b18;
        --bg2: #121a2f;
        --panel: rgba(18, 24, 40, 0.8);
        --panel-border: rgba(133, 180, 255, 0.35);
        --text: #edf7ff;
        --muted: #b5c9e8;
        --gold: #ffd76f;
        --fire: #ff7a6e;
        --ice: #72e5ff;
        --storm: #f6df72;
        --nature: #86ef8e;
        --shadow: #caa8ff;
        --danger: #ff4b78;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, #1c2b4d 0%, var(--bg1) 45%, #040910 100%);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .game-shell {
        width: min(960px, 100%);
        background: rgba(7, 11, 24, 0.92);
        border: 1px solid var(--panel-border);
        border-radius: 22px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      .hud {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px 14px;
        background: linear-gradient(180deg, rgba(20, 31, 48, 0.95), rgba(12, 18, 31, 0.9));
        border-bottom: 1px solid rgba(146, 180, 255, 0.25);
        gap: 10px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .sigil {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(105, 171, 255, 0.5), rgba(89, 58, 156, 0.55));
        border: 1px solid rgba(165, 202, 255, 0.5);
        font-size: 22px;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.1rem, 2vw, 1.8rem);
        letter-spacing: 0.08em;
      }

      .brand small {
        display: block;
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.62rem;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .stat {
        min-width: 92px;
        padding: 7px 12px;
        border-radius: 12px;
        background: rgba(15, 23, 38, 0.9);
        border: 1px solid rgba(146, 180, 255, 0.2);
        text-align: center;
      }

      .stat .label {
        display: block;
        font-size: 0.62rem;
        letter-spacing: 0.09em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .stat .value {
        display: block;
        font-size: clamp(1rem, 2vw, 1.35rem);
        font-weight: 800;
        margin-top: 3px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        color: var(--text);
        background: linear-gradient(180deg, #1b345c, #10213d);
        border: 1px solid rgba(143, 183, 255, 0.4);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button.primary {
        background: linear-gradient(180deg, #8ef1ff, #57c9e8);
        color: #0d1c28;
        border-color: rgba(130, 236, 255, 0.8);
        box-shadow: 0 10px 18px rgba(87, 201, 232, 0.28);
      }

      button.fire { background: linear-gradient(180deg, #ff9a7b, #ff6857); color: #2b0d0c; }
      button.ice { background: linear-gradient(180deg, #9fe7ff, #6bc5f8); color: #082f3d; }
      button.storm { background: linear-gradient(180deg, #fceba0, #f1c94f); color: #322b08; }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: linear-gradient(180deg, rgba(22,35,54,0.94), rgba(8,12,24,0.98));
      }

      .footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 18px 17px;
        background: rgba(10, 16, 27, 0.85);
        border-top: 1px solid rgba(146, 180, 255, 0.18);
        color: var(--muted);
        font-size: 0.75rem;
      }

      .footer strong { color: var(--text); }

      @media (max-width: 700px) {
        body { padding: 10px; }
        .hud { padding: 12px; }
        .controls { width: 100%; justify-content: space-between; }
        .footer { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="brand">
          <div class="sigil">✦</div>
          <div>
            <h1>ELEMENTAL GUARDIANS</h1>
            <small>Arena survival</small>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
          <div class="stat"><span class="label">Health</span><span class="value" id="health">5</span></div>
          <div class="stat"><span class="label">Wave</span><span class="value" id="wave">1</span></div>
          <div class="stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
        </div>

        <div class="controls">
          <button id="startBtn" class="primary" type="button">Start</button>
          <button id="fireBtn" class="fire" type="button">Fire</button>
          <button id="iceBtn" class="ice" type="button">Ice</button>
          <button id="stormBtn" class="storm" type="button">Storm</button>
        </div>
      </div>

      <canvas id="game" width="900" height="560" aria-label="Elemental Guardians arena game"></canvas>

      <div class="footer">
        <span><strong>Move:</strong> WASD / Arrow keys</span>
        <span><strong>Shoot:</strong> Space or click</span>
        <span><strong>Switch:</strong> 1 / 2 / 3</span>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const healthEl = document.getElementById('health');
      const waveEl = document.getElementById('wave');
      const bestEl = document.getElementById('best');
      const startBtn = document.getElementById('startBtn');

      const state = {
        started: false,
        gameOver: false,
        score: 0,
        best: Number(localStorage.getItem('eg-arena-best') || 0),
        health: 5,
        wave: 1,
        time: 0,
        enemyTimer: 0,
        spawnInterval: 1.1,
        pointerX: canvas.width / 2,
        pointerY: canvas.height / 2,
      };

      const elementColors = {
        fire: '#ff7a6e',
        ice: '#72e5ff',
        storm: '#f6df72',
      };

      const player = {
        x: canvas.width / 2,
        y: canvas.height - 60,
        r: 17,
        speed: 350,
        cooldown: 0,
        element: 'fire',
        dash: 0,
      };

      const keys = {};
      const projectiles = [];
      const enemies = [];
      const particles = [];
      const pickups = [];

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function setBest() {
        state.best = Math.max(state.best, state.score);
        localStorage.setItem('eg-arena-best', String(state.best));
        bestEl.textContent = String(state.best);
      }

      function updateHud() {
        scoreEl.textContent = String(state.score);
        healthEl.textContent = String(state.health);
        waveEl.textContent = String(state.wave);
        bestEl.textContent = String(state.best);
      }

      function spawnEnemy() {
        const radius = 12 + Math.random() * 18;
        const x = 30 + Math.random() * (canvas.width - 60);
        const damage = 1 + state.wave * 0.08;

        enemies.push({
          x,
          y: -radius,
          r: radius,
          speed: 45 + state.wave * 12 + Math.random() * 50,
          drift: (Math.random() - 0.5) * 120,
          hp: 1 + Math.floor(state.wave / 3),
          maxHp: 1 + Math.floor(state.wave / 3),
          damage,
          hue: Math.random() > 0.66 ? '#caa8ff' : Math.random() > 0.5 ? '#86ef8e' : '#ffb86a',
        });
      }

      function shoot() {
        if (!state.started || state.gameOver || player.cooldown > 0) return;

        const dx = state.pointerX - player.x;
        const dy = state.pointerY - player.y;
        const angle = Math.atan2(dy, dx || 1);

        const color = elementColors[player.element] || '#ffffff';
        const damage = player.element === 'storm' ? 2 : player.element === 'ice' ? 1.6 : 1.25;

        projectiles.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(angle) * 650,
          vy: Math.sin(angle) * 650,
          r: player.element === 'storm' ? 6 : 5,
          color,
          damage,
          life: 1.5,
        });

        player.cooldown = player.element === 'storm' ? 0.15 : 0.22;
      }

      function createParticles(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 180,
            vy: (Math.random() - 0.5) * 180,
            life: 0.5 + Math.random() * 0.7,
            color,
            r: 2 + Math.random() * 3,
          });
        }
      }

      function createPickup(x, y) {
        const chance = Math.random();
        const type = chance > 0.65 ? 'storm' : chance > 0.3 ? 'ice' : 'fire';
        pickups.push({ x, y, r: 9, type, speed: 110, life: 7 });
      }

      function resetGame() {
        state.started = true;
        state.gameOver = false;
        state.score = 0;
        state.health = 5;
        state.wave = 1;
        state.time = 0;
        state.enemyTimer = 0;
        state.spawnInterval = 1.1;
        projectiles.length = 0;
        enemies.length = 0;
        particles.length = 0;
        pickups.length = 0;
        player.x = canvas.width / 2;
        player.y = canvas.height - 60;
        player.cooldown = 0;
        player.element = 'fire';
        startBtn.textContent = 'Restart';
        updateHud();
      }

      function endGame() {
        state.started = false;
        state.gameOver = true;
        setBest();
        startBtn.textContent = 'Play Again';
      }

      function changeElement(name) {
        player.element = name;
      }

      function handleInput(dt) {
        let moveX = 0;
        let moveY = 0;

        if (keys['ArrowLeft'] || keys['a']) moveX -= 1;
        if (keys['ArrowRight'] || keys['d']) moveX += 1;
        if (keys['ArrowUp'] || keys['w']) moveY -= 1;
        if (keys['ArrowDown'] || keys['s']) moveY += 1;

        const mag = Math.hypot(moveX, moveY) || 1;
        moveX /= mag;
        moveY /= mag;

        player.x += moveX * player.speed * dt;
        player.y += moveY * player.speed * dt;
        player.x = clamp(player.x, 28, canvas.width - 28);
        player.y = clamp(player.y, 38, canvas.height - 28);

        player.cooldown = Math.max(0, player.cooldown - dt);
      }

      function update(dt) {
        if (!state.started || state.gameOver) return;

        state.time += dt;
        state.enemyTimer -= dt;

        if (state.score >= state.wave * 25) {
          state.wave += 1;
          state.spawnInterval = Math.max(0.35, 1.1 - (state.wave - 1) * 0.06);
        }

        if (state.enemyTimer <= 0) {
          spawnEnemy();
          state.enemyTimer = state.spawnInterval;
        }

        handleInput(dt);

        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;

          if (p.life <= 0 || p.x < -20 || p.x > canvas.width + 20 || p.y < -20 || p.y > canvas.height + 20) {
            projectiles.splice(i, 1);
            continue;
          }

          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const distance = Math.hypot(p.x - e.x, p.y - e.y);
            if (distance < e.r + p.r) {
              e.hp -= p.damage;
              createParticles(p.x, p.y, p.color, 7);
              projectiles.splice(i, 1);

              if (e.hp <= 0) {
                createParticles(e.x, e.y, e.hue, 20);
                state.score += 10;
                if (Math.random() < 0.22) createPickup(e.x, e.y);
                enemies.splice(j, 1);
              }
              break;
            }
          }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.y += e.speed * dt;
          e.x += e.drift * dt;

          if (e.x < e.r) e.x = e.r;
          if (e.x > canvas.width - e.r) e.x = canvas.width - e.r;

          if (e.y - e.r > canvas.height) {
            enemies.splice(i, 1);
            state.health -= e.damage;
            createParticles(e.x, canvas.height, '#ff4b78', 18);
            if (state.health <= 0) {
              endGame();
              updateHud();
              return;
            }
          }
        }

        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.y += p.speed * dt;
          p.life -= dt;

          const distance = Math.hypot(player.x - p.x, player.y - p.y);
          if (distance < player.r + p.r + 4) {
            if (p.type === 'ice') state.health = Math.min(9, state.health + 1);
            if (p.type === 'fire') state.score += 18;
            if (p.type === 'storm') {
              state.score += 25;
              for (let i2 = 0; i2 < 3; i2++) {
                const angle = (Math.PI * 2 * i2) / 3;
                projectiles.push({
                  x: player.x,
                  y: player.y,
                  vx: Math.cos(angle) * 520,
                  vy: Math.sin(angle) * 520,
                  r: 5,
                  color: '#f6df72',
                  damage: 2.2,
                  life: 1.1,
                });
              }
            }
            createParticles(p.x, p.y, elementColors[p.type], 16);
            pickups.splice(i, 1);
          } else if (p.life <= 0) {
            pickups.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
        }

        updateHud();
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a2944');
        gradient.addColorStop(1, '#040914');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(140, 195, 255, 0.18)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.fillStyle = elementColors[player.element];
        ctx.shadowBlur = 18;
        ctx.shadowColor = elementColors[player.element];

        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(15, 16);
        ctx.lineTo(0, 10);
        ctx.lineTo(-15, 16);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath();
        ctx.arc(-4, -6, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawEnemy(enemy) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.fillStyle = enemy.hue;
        ctx.shadowBlur = 16;
        ctx.shadowColor = enemy.hue;
        ctx.beginPath();
        ctx.arc(0, 0, enemy.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(-enemy.r * 0.7, -enemy.r - 10, enemy.r * 1.4, 4);
        ctx.fillStyle = '#1a2335';
        ctx.fillRect(-enemy.r * 0.7, -enemy.r - 10, enemy.r * 1.4 * (enemy.hp / enemy.maxHp), 4);
        ctx.restore();
      }

      function drawProjectile(p) {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 16;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawPickup(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.fillStyle = elementColors[p.type];
        ctx.shadowBlur = 18;
        ctx.shadowColor = elementColors[p.type];
        ctx.beginPath();
        ctx.moveTo(0, -11);
        ctx.lineTo(9, 0);
        ctx.lineTo(0, 11);
        ctx.lineTo(-9, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawParticles() {
        for (const p of particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life * 1.4);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawHudText() {
        if (!state.started) {
          ctx.fillStyle = 'rgba(2, 5, 12, 0.5)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#edf7ff';
          ctx.textAlign = 'center';
          ctx.font = '800 42px Segoe UI';
          ctx.fillText('Elemental Guardians', canvas.width / 2, canvas.height / 2 - 42);
          ctx.font = '600 18px Segoe UI';
          ctx.fillStyle = '#cfe5ff';
          ctx.fillText('WASD to move • Space or click to fire • 1, 2, 3 to switch elements', canvas.width / 2, canvas.height / 2 + 4);
          ctx.fillText('Survive the incoming waves and protect the crystal gate.', canvas.width / 2, canvas.height / 2 + 34);
        }

        if (state.gameOver) {
          ctx.fillStyle = 'rgba(15, 12, 22, 0.44)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffd8e2';
          ctx.font = '800 40px Segoe UI';
          ctx.fillText('The crystal fell', canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = '600 20px Segoe UI';
          ctx.fillStyle = '#e2efff';
          ctx.fillText(`Score: ${state.score}   •   Best: ${state.best}`, canvas.width / 2, canvas.height / 2 + 26);
        }
      }

      function render() {
        drawBackground();

        for (const p of pickups) drawPickup(p);
        for (const p of projectiles) drawProjectile(p);
        for (const e of enemies) drawEnemy(e);
        drawParticles();
        drawPlayer();
        drawHudText();
      }

      let lastTime = 0;
      function loop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.033);
        lastTime = timestamp;

        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      function onPointerMove(event) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        state.pointerX = (event.clientX - rect.left) * scaleX;
        state.pointerY = (event.clientY - rect.top) * scaleY;
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        keys[event.key] = true;
        keys[key] = true;

        if (key === ' ') {
          event.preventDefault();
          shoot();
        }

        if (key === '1') changeElement('fire');
        if (key === '2') changeElement('ice');
        if (key === '3') changeElement('storm');
      });

      document.addEventListener('keyup', (event) => {
        keys[event.key] = false;
        keys[event.key.toLowerCase()] = false;
      });

      canvas.addEventListener('mousemove', onPointerMove);
      canvas.addEventListener('click', shoot);
      canvas.addEventListener('touchstart', (event) => {
        const touch = event.touches[0];
        if (touch) onPointerMove(touch);
        shoot();
      }, { passive: true });

      startBtn.addEventListener('click', () => {
        resetGame();
      });

      document.getElementById('fireBtn').addEventListener('click', () => changeElement('fire'));
      document.getElementById('iceBtn').addEventListener('click', () => changeElement('ice'));
      document.getElementById('stormBtn').addEventListener('click', () => changeElement('storm'));

      updateHud();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
